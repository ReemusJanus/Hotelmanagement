services:
  mariadb:
    image: mariadb:11.4
    container_name: knockout-mariadb
    restart: unless-stopped
    environment:
      TZ: Asia/Kolkata
      MARIADB_ROOT_PASSWORD: knockout_root
      MARIADB_ROOT_HOST: "%"
      MARIADB_DATABASE: knockout
      MARIADB_USER: knockout
      MARIADB_PASSWORD: knockout_pass
    ports:
      - "3307:3306"
    volumes:
      - knockout_mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: knockout-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
      PMA_ARBITRARY: 0
      UPLOAD_LIMIT: 64M
    ports:
      - "9200:80"
    depends_on:
      mariadb:
        condition: service_healthy

  minio:
    image: minio/minio:latest
    container_name: knockout-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: knockout
      MINIO_ROOT_PASSWORD: knockout_secret
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - knockout_minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  admin-backend:
    build: ./backend
    container_name: knockout-admin-backend
    restart: unless-stopped
    environment:
      TZ: Asia/Kolkata
      PORT: 6001
      PORTAL_ROLE: admin
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_USER: knockout
      DB_PASSWORD: knockout_pass
      DB_NAME: knockout
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: knockout
      MINIO_SECRET_KEY: knockout_secret
      MINIO_BUCKET: food-images
      MINIO_PUBLIC_URL: http://localhost:9100
      SMS_WEBHOOK_URL: ${SMS_WEBHOOK_URL:-}
      SMS_WEBHOOK_TOKEN: ${SMS_WEBHOOK_TOKEN:-}
    expose:
      - "6001"
    depends_on:
      mariadb:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:6001/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 20

  waiter-backend:
    build: ./backend
    container_name: knockout-waiter-backend
    restart: unless-stopped
    environment:
      TZ: Asia/Kolkata
      PORT: 7000
      PORTAL_ROLE: waiter
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_USER: knockout
      DB_PASSWORD: knockout_pass
      DB_NAME: knockout
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: knockout
      MINIO_SECRET_KEY: knockout_secret
      MINIO_BUCKET: food-images
      MINIO_PUBLIC_URL: http://localhost:9100
    expose:
      - "7000"
    depends_on:
      admin-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:7000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 20

  chef-backend:
    build: ./backend
    container_name: knockout-chef-backend
    restart: unless-stopped
    environment:
      TZ: Asia/Kolkata
      PORT: 8000
      PORTAL_ROLE: chef
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_USER: knockout
      DB_PASSWORD: knockout_pass
      DB_NAME: knockout
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: knockout
      MINIO_SECRET_KEY: knockout_secret
      MINIO_BUCKET: food-images
      MINIO_PUBLIC_URL: http://localhost:9100
    expose:
      - "8000"
    depends_on:
      admin-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 20

  superadmin-backend:
    build: ./backend
    container_name: knockout-master-backend
    restart: unless-stopped
    command: node src/master-server.js
    environment:
      PORT: 5000
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_ROOT_USER: root
      DB_ROOT_PASSWORD: knockout_root
      MASTER_DB_NAME: knockout_master
    ports:
      - "5100:5000"
    depends_on:
      admin-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 20

  admin-frontend:
    build: ./frontend
    container_name: knockout-admin-frontend
    restart: unless-stopped
    environment:
      VITE_PORTAL_ROLE: admin
      VITE_API_URL: /api
      VITE_PROXY_TARGET: http://admin-backend:6001
    command: npm run dev -- --host 0.0.0.0 --port 6100
    expose:
      - "6100"
    depends_on:
      admin-backend:
        condition: service_healthy

  waiter-frontend:
    build: ./frontend
    container_name: knockout-waiter-frontend
    restart: unless-stopped
    environment:
      VITE_PORTAL_ROLE: waiter
      VITE_API_URL: /api
      VITE_PROXY_TARGET: http://waiter-backend:7000
    command: npm run dev -- --host 0.0.0.0 --port 7100
    expose:
      - "7100"
    depends_on:
      waiter-backend:
        condition: service_healthy

  chef-frontend:
    build: ./frontend
    container_name: knockout-chef-frontend
    restart: unless-stopped
    environment:
      VITE_PORTAL_ROLE: chef
      VITE_API_URL: /api
      VITE_PROXY_TARGET: http://chef-backend:8000
    command: npm run dev -- --host 0.0.0.0 --port 8100
    expose:
      - "8100"
    depends_on:
      chef-backend:
        condition: service_healthy

  superadmin-frontend:
    build: ./frontend
    container_name: knockout-master-frontend
    restart: unless-stopped
    environment:
      VITE_PORTAL_ROLE: unified
      VITE_API_URL: /api
      VITE_PROXY_TARGET: http://superadmin-backend:5000
    command: npm run dev -- --host 0.0.0.0 --port 5000
    ports:
      - "5200:5000"
    depends_on:
      superadmin-backend:
        condition: service_healthy

volumes:
  knockout_mariadb:
  knockout_minio:
