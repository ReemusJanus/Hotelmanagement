services:
  mariadb:
    image: mariadb:11.4
    container_name: knockout-mariadb
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Kolkata}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_ROOT_HOST: "%"
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_EXTERNAL_PORT:-3307}:3306"
    volumes:
      - knockout_mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: knockout-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
      PMA_ARBITRARY: 0
      UPLOAD_LIMIT: ${PHPMYADMIN_UPLOAD_LIMIT:-64M}
    ports:
      - "${PHPMYADMIN_PORT:-9200}:80"
    depends_on:
      mariadb:
        condition: service_healthy

  minio:
    image: minio/minio:latest
    container_name: knockout-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "${MINIO_API_PORT:-9100}:9000"
      - "${MINIO_CONSOLE_PORT:-9101}:9001"
    volumes:
      - knockout_minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  admin-backend:
    build: ./backend
    container_name: knockout-admin-backend
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Kolkata}
      PORT: 6001
      PORTAL_ROLE: admin
      DB_HOST: ${DB_HOST:-mariadb}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio}
      MINIO_PORT: ${MINIO_PORT:-9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-food-images}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL}
      SMS_WEBHOOK_URL: ${SMS_WEBHOOK_URL:-}
      SMS_WEBHOOK_TOKEN: ${SMS_WEBHOOK_TOKEN:-}
    expose:
      - "6001"
    depends_on:
      mariadb:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:6001/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 20

  waiter-backend:
    build: ./backend
    container_name: knockout-waiter-backend
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Kolkata}
      PORT: 7000
      PORTAL_ROLE: waiter
      DB_HOST: ${DB_HOST:-mariadb}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio}
      MINIO_PORT: ${MINIO_PORT:-9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-food-images}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL}
    expose:
      - "7000"
    depends_on:
      admin-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:7000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 20

  chef-backend:
    build: ./backend
    container_name: knockout-chef-backend
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Kolkata}
      PORT: 8000
      PORTAL_ROLE: chef
      DB_HOST: ${DB_HOST:-mariadb}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio}
      MINIO_PORT: ${MINIO_PORT:-9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-food-images}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL}
    expose:
      - "8000"
    depends_on:
      admin-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 20

  juicer-backend:
    build: ./backend
    container_name: knockout-juicer-backend
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Kolkata}
      PORT: 9000
      PORTAL_ROLE: juicer
      DB_HOST: ${DB_HOST:-mariadb}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio}
      MINIO_PORT: ${MINIO_PORT:-9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-food-images}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL}
    expose:
      - "9000"
    depends_on:
      admin-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:9000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 20

  superadmin-backend:
    build: ./backend
    container_name: knockout-master-backend
    restart: unless-stopped
    command: npm run start:master
    environment:
      PORT: 5000
      TZ: ${TZ:-Asia/Kolkata}
      DB_HOST: ${DB_HOST:-mariadb}
      DB_PORT: ${DB_PORT:-3306}
      DB_ROOT_USER: ${DB_ROOT_USER:-root}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MASTER_DB_NAME: ${MASTER_DB_NAME:-knockout_master}
    ports:
      - "${BACKEND_PORT:-5100}:5000"
    depends_on:
      admin-backend:
        condition: service_healthy
      juicer-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 20

  superadmin-frontend:
    build: ./frontend
    container_name: knockout-master-frontend
    restart: unless-stopped
    environment:
      VITE_PORTAL_ROLE: unified
      VITE_API_URL: /api
      VITE_PROXY_TARGET: http://superadmin-backend:5000
    command: npm run dev -- --host 0.0.0.0 --port 5000
    ports:
      - "${FRONTEND_PORT:-5200}:5000"
    depends_on:
      superadmin-backend:
        condition: service_healthy

volumes:
  knockout_mariadb:
  knockout_minio:
